<!DOCTYPE html>
<html>
<head>

<title>Hidajet & Yllka</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body {

margin:0;
padding:0;
overflow-x:hidden;
background:white;
color:#5a4032;
text-align:center;
font-family:'Cormorant Garamond',serif;

}

#envelope {

position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
transition:1.2s;

}


.envelope-image {

width:650px;
max-width:85%;
cursor:pointer;
border-radius:15px;
box-shadow:0 20px 60px rgba(0,0,0,.25);

}


.full-photo {

width:100vw;
height:100vh;
object-fit:cover;
display:block;
margin:0;
padding:0;

}
}


.frame {

.frame {

min-height:auto;
margin:40px 20px;
padding:40px 20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
box-sizing:border-box;
border-radius:25px;
border:1px solid #d8c2a3;
box-shadow:0 10px 30px rgba(0,0,0,0.08);

}


.countdown-frame {

background:#faf7f2;

}


.location-frame {

background:white;

}


h1 {

font-family:'Great Vibes',cursive;
font-size:75px;
color:#b08d57;

}


h2 {

font-size:45px;
font-weight:300;
color:#b08d57;

}


p {

font-size:30px;

}


.map-button {

padding:15px 35px;
background:#b08d57;
color:white;
text-decoration:none;
border-radius:30px;
font-size:25px;

}


.gallery img {

width:100%;
display:block;
margin:20px 0;

}


</style>

</head>

<body>


<audio id="music" loop>

<source src="piano.mp3" type="audio/mp3">

</audio>



<div id="envelope" onclick="openEnvelope()">

<img src="envelope.jpg" class="envelope-image">

</div>



<img src="foto.jpg" class="full-photo">


<img src="ftesa.jpg" class="full-photo">



<section class="frame countdown-frame">

<h1>
Hidajet & Yllka
</h1>


<h2>
15 Gusht 2026
</h2>


<p>
Koha e mbetur deri në ditën tonë speciale
</p>


<h2 id="countdown"></h2>


</section>




<section class="frame location-frame">

<h2>
Lokacioni
</h2>


<p>
Villa Natyra<br>
Vranidoll
</p>


<a class="map-button" href="https://www.google.com/maps/search/?api=1&query=Villa+Natyra+Vranidoll" target="_blank">

Hap Google Maps

</a>


</section>



<div class="gallery">


<img src="gallery1.jpg">

<img src="gallery2.jpg">

<img src="gallery3.jpg">

<img src="gallery4.jpg">


</div>

<script>


function openEnvelope(){

let envelope = document.getElementById("envelope");

let music = document.getElementById("music");


music.volume = 0.7;

music.play().catch(function(error){

console.log("Music blocked:", error);

});



envelope.style.transform="scale(1.5)";

envelope.style.opacity="0";



setTimeout(function(){

envelope.style.display="none";

},1200);


}




let date = new Date("August 15, 2026 00:00:00").getTime();



setInterval(function(){


let now = new Date().getTime();

let distance = date - now;



let days = Math.floor(distance/(1000*60*60*24));

let hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));

let minutes = Math.floor((distance%(1000*60*60))/(1000*60));

let seconds = Math.floor((distance%(1000*60))/1000);



document.getElementById("countdown").innerHTML =

days+" Ditë "+hours+" Orë "+minutes+" Minuta "+seconds+" Sekonda";



},1000);



</script>


</body>

</html>
