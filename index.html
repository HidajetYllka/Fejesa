<!DOCTYPE html>
<html>
<head>

<title>Hidajet & Yllka</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">


<style>

body {
    margin:0;
    background:white;
    font-family:'Montserrat', sans-serif;
    text-align:center;
    color:#4a2c20;
}


/* ENVELOPE */

#envelope {
    position:fixed;
    inset:0;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:1s;
}


.envelope-image {
    width:500px;
    max-width:85%;
    border-radius:15px;
    cursor:pointer;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    animation:pulse 2s infinite;
}


@keyframes pulse {

50% {
    transform:scale(1.05);
}

}



/* TEXT */

.welcome {

    margin-top:50px;
    font-family:'Great Vibes', cursive;
    font-weight:400;
    font-size:80px;
    color:#b8860b;
    animation:show 2s;

}



h1 {

    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:60px;
    color:#8b5e3c;

}



h2 {

    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:38px;
    color:#b8860b;

}



p {

    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:26px;
    letter-spacing:1px;
    color:#6b4f3a;

}



#countdown {

    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:35px;
    letter-spacing:2px;

}



@keyframes show {

from {
    opacity:0;
    transform:translateY(40px);
}

to {
    opacity:1;
    transform:translateY(0);
}

}



/* PHOTOS */


.main-photo {

    width:90%;
    max-width:420px;
    margin:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);

}


.gallery {

    display:flex;
    flex-direction:column;
    align-items:center;

}


.gallery img {

    width:90%;
    max-width:350px;
    margin:15px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);

}
</style>

</head>


<body>


<div id="envelope" onclick="openEnvelope()">

<img src="envelope.jpg" class="envelope-image">

</div>



<h1 class="welcome">
Ftesë Fejese
</h1>


<h1>
Hidajet & Yllka
</h1>


<h2>
15 Gusht 2026
</h2>


<p>
Koha e mbetur deri në ditën tonë speciale
</p>


<h2 id="countdown"></h2>



<img src="foto.jpg" class="main-photo">


<img src="ftesa.jpg" class="main-photo">

<div class="gallery">

<img src="photos/gallery1.jpg">
<img src="photos/gallery2.jpg">
<img src="photos/gallery3.jpg">
<img src="photos/gallery4.jpg">

</div>



<script>


function openEnvelope(){

let env = document.getElementById("envelope");

env.style.transform = "scale(1.5)";
env.style.opacity = "0";


setTimeout(function(){

env.style.display = "none";

},1000);

}




let date = new Date("August 15, 2026 00:00:00").getTime();


setInterval(function(){


let now = new Date().getTime();

let distance = date - now;


let days = Math.floor(distance/(1000*60*60*24));

let hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));

let minutes = Math.floor((distance%(1000*60*60))/(1000*60));

let seconds = Math.floor((distance%(1000*60))/1000);



document.getElementById("countdown").innerHTML =

days+" Ditë "+hours+" Orë "+minutes+" Minuta "+seconds+" Sekonda";


},1000);



</script>


</body>
</html>
