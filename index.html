<!DOCTYPE html>
<html>
<head>

<title>Hidajet & Yllka</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">


<style>

body {
    margin:0;
    background:white;
    color:#5a4032;
    text-align:center;
    font-family:'Montserrat',sans-serif;
}


#envelope {

position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
transition:1.2s;

}



.envelope-image {

width:520px;
max-width:85%;
cursor:pointer;
border-radius:15px;
box-shadow:0 20px 60px rgba(0,0,0,0.25);
animation:pulse 2.5s infinite;

}



@keyframes pulse {

50% {

transform:scale(1.05);

}

}



.welcome {

font-family:'Great Vibes',cursive;
font-size:85px;
font-weight:400;
color:#b08d57;

}



h1 {

font-family:'Cormorant Garamond',serif;
font-size:60px;
font-weight:300;
color:#7b4f2c;

}



h2 {

font-family:'Cormorant Garamond',serif;
font-size:38px;
font-weight:300;
color:#b08d57;

}



p {

font-family:'Cormorant Garamond',serif;
font-size:28px;

}



.full-photo {

width:100%;
height:100vh;
object-fit:cover;
display:block;

}


.details {

padding:50px 20px;

}


.map-button {

display:inline-block;
margin-top:20px;
padding:15px 35px;
background:#b08d57;
color:white;
text-decoration:none;
border-radius:30px;
font-family:'Cormorant Garamond',serif;
font-size:25px;

}


#countdown {

font-family:'Cormorant Garamond',serif;
font-size:35px;

}


</style>

</head>

<body>


<audio id="music" loop>

<source src="piano.mp3" type="audio/mp3">

</audio>



<div id="envelope" onclick="openEnvelope()">

<img src="envelope.jpg" class="envelope-image">

</div>



<img src="foto.jpg" class="full-photo">


<img src="ftesa.jpg" class="full-photo">



<section class="details">


<h1>
Hidajet & Yllka
</h1>


<h2>
15 Gusht 2026
</h2>


<p>
Koha e mbetur deri në ditën tonë speciale
</p>


<h2 id="countdown"></h2>


<h2>
Lokacioni
</h2>


<p>
Villa Natyra<br>
Vranidoll
</p>


<a class="map-button" href="https://www.google.com/maps/search/?api=1&query=Villa+Natyra+Vranidoll" target="_blank">

Hap Google Maps

</a>


</section>

<script>


function openEnvelope(){

let envelope = document.getElementById("envelope");

let music = document.getElementById("music");


// Start piano when envelope is clicked

music.volume = 0.7;

music.play().catch(function(error){

console.log("Music blocked:", error);

});



envelope.style.transform="scale(1.5)";

envelope.style.opacity="0";



setTimeout(function(){

envelope.style.display="none";

},1200);


}




let date = new Date("August 15, 2026 00:00:00").getTime();



setInterval(function(){


let now = new Date().getTime();

let distance = date - now;



let days = Math.floor(distance/(1000*60*60*24));

let hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));

let minutes = Math.floor((distance%(1000*60*60))/(1000*60));

let seconds = Math.floor((distance%(1000*60))/1000);



document.getElementById("countdown").innerHTML =

days+" Ditë "+hours+" Orë "+minutes+" Minuta "+seconds+" Sekonda";



},1000);



</script>


</body>

</html>
